name: A carrier stopped working
description: Report a retrieval or parsing problem with a public or synthetic number.
body:
  - type: input
    id: carrier
    attributes:
      label: Carrier and package version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the failure kind and expected behavior. Leave out the numbers, postcodes, links and recipient details of your own parcels.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A public number with the page that publishes it, a synthetic fixture, or the error details.
