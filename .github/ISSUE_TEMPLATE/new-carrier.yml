name: Add a carrier
description: Suggest an anonymous tracking source.
body:
  - type: input
    id: name
    attributes:
      label: Carrier name and home country
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public tracking website
      description: Leave out your own parcels' numbers, postcodes and access tokens.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Tracking formats and requirements
      description: Number shapes, public sample numbers with the pages that give them, required inputs and public documentation.
